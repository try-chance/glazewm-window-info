[package]
name = "glazewm-window-info"
version = "0.1.0"
edition = "2024"
description = "A compact viewer for GlazeWM focused-window information"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
global-hotkey = "0.8.0"
serde_json = "1.0.151"
single-instance = "0.3.3"
tray-icon = "0.24.2"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
